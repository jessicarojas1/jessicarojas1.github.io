# VERITY — Render Blueprint.
# Provisions the app + a PostgreSQL database. Local email/password sign-in
# works out of the box (no Entra/Graph configuration required). After first
# deploy, run `php database/seed.php --force` via a Render shell for synthetic
# demo data, or apply `database/schema.sql` directly for an empty install.
#
# BOUNDARY: this commercial Render blueprint is for development/demo use only.
# Verity's GCC High connector is a MOCK in this build (not yet implemented —
# see docs/GCC_HIGH_INTEGRATION.md) and no CUI/FCI/regulated data should be
# loaded into this deployment. A production CUI-boundary deployment belongs on
# an authorized on-prem/Azure Government/AWS GovCloud target — see
# deployments/KUBERNETES.md, AZURE.md, AWS.md, SINGLE_LINUX_SERVER.md.
#
# OPTIONAL future Entra ID GCC High SSO config (not yet wired to a sign-in
# flow in this build — see docs/GCC_HIGH_INTEGRATION.md):
#   ENTRA_AUTHORITY_HOST=https://login.microsoftonline.us
#   GRAPH_BASE_URL=https://graph.microsoft.us
#   AZURE_PORTAL_URL=https://portal.azure.us
#   ENTRA_TENANT_ID / ENTRA_CLIENT_ID / ENTRA_CLIENT_SECRET / ENTRA_REDIRECT_URI

databases:
  - name: verity-db
    plan: free

services:
  - type: web
    name: verity-iga
    runtime: docker
    rootDir: verity
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verity-db
          property: connectionString

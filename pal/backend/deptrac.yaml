# Module boundaries for the modular monolith (ADR-0001). CI fails on violations.
deptrac:
  paths:
    - ./src
  layers:
    - name: Platform
      collectors:
        - { type: classLike, value: '^App\\Platform\\.*' }
    - name: Audit
      collectors:
        - { type: classLike, value: '^App\\Audit\\.*' }
    - name: Identity
      collectors:
        - { type: classLike, value: '^App\\Identity\\.*' }
    - name: Settings
      collectors:
        - { type: classLike, value: '^App\\Settings\\.*' }
    - name: Storage
      collectors:
        - { type: classLike, value: '^App\\Storage\\.*' }
    - name: Documents
      collectors:
        - { type: classLike, value: '^App\\Documents\\.*' }
  ruleset:
    Platform:
      # The scheduler wires messages from feature modules; nothing else in Platform may.
      - Audit
      - Identity
    Audit:
      - Platform
    Identity:
      - Platform
      - Audit
      - Settings
    Settings:
      - Platform
      - Audit
      - Identity
    Storage:
      - Platform
      - Audit
      - Identity
    Documents:
      - Platform
      - Audit
      - Identity
      - Storage

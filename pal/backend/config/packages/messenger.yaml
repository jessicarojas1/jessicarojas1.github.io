framework:
    messenger:
        failure_transport: failed

        routing:
            # Off-request directory work goes to the durable queue so a large group's membership
            # pull cannot time out the HTTP request that triggered it (OPEN_ITEMS I8). Consumed by
            # the `messenger:consume async` worker; the message is durable in PostgreSQL until then.
            App\Identity\Message\SyncDirectoryGroup: async

        transports:
            # Durable queue in PostgreSQL. Handlers must be idempotent (at-least-once delivery).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 3
                    max_delay: 600000
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: failed

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'

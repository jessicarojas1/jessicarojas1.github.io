framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # Behind nginx (same container) and possibly a load balancer. Only these proxies may
    # set X-Forwarded-*; only these hosts are accepted (Host-header attack protection).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']
    trusted_hosts: '%env(TRUSTED_HOSTS)%'

    csrf_protection:
        enabled: true

    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        name: '%env(PAL_SESSION_COOKIE_NAME)%'
        cookie_secure: '%env(bool:PAL_SESSION_COOKIE_SECURE)%'
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: '%env(int:PAL_SESSION_IDLE_SECONDS)%'
        gc_probability: 1
        gc_divisor: 100

    http_client:
        default_options:
            timeout: 10
            max_redirects: 0

    rate_limiter:
        auth_login:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        api:
            policy: sliding_window
            limit: 600
            interval: '1 minute'
        # Per-username password attempts (complements per-IP auth_login and account lockout).
        login_username:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Per-IP budget for unauthenticated sign-in reads (/auth/methods, /auth/login), which
        # each start a session. Bounds anonymous session-row flooding; generous for real users.
        auth_read:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # Per-user uploads (PAL_UPLOAD_DAILY_BYTES bounds the volume stored).
        upload:
            policy: sliding_window
            limit: 30
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        cache:
            app: cache.adapter.array
        rate_limiter:
            # Functional tests make many requests per user; the limiter itself is covered by
            # ApiRateLimitSubscriberTest with its own small budget.
            api:
                policy: sliding_window
                limit: 100000
                interval: '1 minute'
            auth_login:
                policy: sliding_window
                limit: 100000
                interval: '1 minute'
            upload:
                policy: sliding_window
                limit: 100000
                interval: '1 hour'
            login_username:
                policy: sliding_window
                limit: 100000
                interval: '1 minute'
            auth_read:
                policy: sliding_window
                limit: 100000
                interval: '1 minute'
        http_client:
            mock_response_factory: App\Tests\Support\FakeEntraId

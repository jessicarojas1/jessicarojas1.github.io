monolog:
    channels:
        - deprecation
        # Audit/security events forwarded to the SIEM (Microsoft Sentinel). See ADR-0011.
        - pal_audit

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

# Production: structured JSON on stderr for the container runtime / log collector.
when@prod:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: '%env(LOG_LEVEL)%'
                formatter: monolog.formatter.json
                channels: ['!event', '!deprecation']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!deprecation']

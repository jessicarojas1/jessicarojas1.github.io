# PAL web tier: serves the SPA and routes /api, /auth and /health to Symfony.
# TLS terminates at the reverse proxy / load balancer in front of this container.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # HSTS only when the request reached the proxy over HTTPS.
    map $http_x_forwarded_proto $pal_hsts {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }
    # Propagate an upstream request ID, or use nginx's own.
    map $http_x_request_id $pal_request_id {
        ~^[A-Za-z0-9-]{8,64}$ $http_x_request_id;
        default               $request_id;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /srv/pal/frontend;

        add_header Strict-Transport-Security $pal_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Never serve dotfiles.
        location ~ /\. {
            return 404;
        }

        # Application endpoints -> Symfony front controller. Symfony sets its own
        # security headers (strict CSP, frame denial) on these responses.
        location ~ ^/(api|auth|health)(/|$) {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/pal/backend/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_X_REQUEST_ID $pal_request_id;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 60s;
            # Declaring headers here stops inheritance of the server-level set: Symfony already
            # sends nosniff/Referrer-Policy/CSP, so only add what it does not.
            add_header Strict-Transport-Security $pal_hsts always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        }

        # Fingerprinted build assets: cache forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security $pal_hsts always;
            try_files $uri =404;
        }

        # SPA: every other path renders index.html with the production CSP.
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security $pal_hsts always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            try_files $uri /index.html;
        }
    }
}

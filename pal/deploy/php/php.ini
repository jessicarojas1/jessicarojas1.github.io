; PAL production PHP settings.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
max_execution_time = 30
; Document uploads: the application limit is PAL_MAX_UPLOAD_BYTES (default 50 MiB, checked by
; UploadService). PHP's ceiling sits just above it; nginx allows large bodies on /api/uploads only.
post_max_size = 52M
upload_max_filesize = 50M
max_input_time = 120
; Sessions are handled by Symfony (PostgreSQL); these only harden PHP's defaults.
session.use_strict_mode = 1
session.cookie_httponly = 1
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

# REDOUBT — Render Blueprint (working NON-CUI deployment).
# Provisions the app + a PostgreSQL database so the portal works end to end with
# local email/password accounts (no Entra/Graph needed). On first load, visit
# /setup to create your program + administrator (optionally load sample data).
#
# BOUNDARY: commercial Render is for NON-CUI use only. A CUI/ITAR production
# instance runs on Kubernetes in an authorized boundary (on-prem / Azure Gov /
# AWS GovCloud) with Microsoft 365 GCC High — see deployments/KUBERNETES.md,
# AZURE.md, AWS.md, SINGLE_LINUX_SERVER.md.
#
# OPTIONAL Entra SSO (adds a "Sign in with Microsoft" button; GCC High endpoints):
#   MS_CLOUD=USGovernment · ENTRA_AUTHORITY_HOST=https://login.microsoftonline.us
#   GRAPH_BASE_URL=https://graph.microsoft.us · GRAPH_SCOPES=https://graph.microsoft.us/.default
#   ENTRA_TENANT_ID / ENTRA_CLIENT_ID / ENTRA_CLIENT_SECRET / ENTRA_REDIRECT_URI

databases:
  - name: redoubt-db
    plan: free

services:
  - type: web
    name: redoubt-program-portal
    runtime: docker
    rootDir: redoubt
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: redoubt-db
          property: connectionString

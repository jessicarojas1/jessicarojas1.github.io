# REDOUBT — Render Blueprint (discovery-phase microsite).
# Usage: this file can be used as a Render Blueprint. If the repository root
# already defines a blueprint, deploy REDOUBT as its own service by pointing a
# new Render service at this directory (rootDir: redoubt) with env=docker.
#
# NOTE ON BOUNDARY: commercial Render hosts the NON-CUI discovery microsite only.
# The production app is SELF-HOSTED ON-PREM in GMRE's CUI boundary (Docker/K8s or
# hardened Linux), talking to Microsoft 365 / Azure GCC High. See
# deployments/SINGLE_LINUX_SERVER.md, deployments/KUBERNETES.md, deployments/AZURE.md.
#
# GCC High endpoints differ from commercial (used by the on-prem Phase 1 env):
#   MS_CLOUD=USGovernment
#   ENTRA_AUTHORITY_HOST=https://login.microsoftonline.us
#   GRAPH_BASE_URL=https://graph.microsoft.us
#   GRAPH_SCOPES=https://graph.microsoft.us/.default

services:
  - type: web
    name: redoubt-program-portal
    runtime: docker
    rootDir: redoubt
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: discovery
      # Phase 1+ (do NOT set real secrets here; use Render secret files / dashboard):
      # - key: DATABASE_URL          # PostgreSQL (portal metadata/config/audit)
      #   sync: false
      # - key: ENTRA_TENANT_ID       # Microsoft Entra ID (OIDC)
      #   sync: false
      # - key: ENTRA_CLIENT_ID
      #   sync: false
      # - key: ENTRA_CLIENT_SECRET   # store as secret, never in source
      #   sync: false
      # - key: GRAPH_SCOPES
      #   value: "Sites.Read.All Files.Read.All"

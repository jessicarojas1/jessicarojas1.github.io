name: PAL CI

# Gates every change under pal/: backend (tests against PostgreSQL 17, static analysis,
# module boundaries, dependency audit), frontend (lint, types, tests, build, audit),
# container (Dockerfile lint, build, Trivy scan) and secret scanning.
on:
  push:
    paths: ['pal/**', '.github/workflows/pal-ci.yml']
  pull_request:
    paths: ['pal/**', '.github/workflows/pal-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pal/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pal
          POSTGRES_PASSWORD: pal
          POSTGRES_DB: pal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pal -d pal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pal:pal@127.0.0.1:5432/pal_test?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, openssl, sodium
          coverage: none
          tools: composer:v2

      # Symfony's post-install scripts need .env, so create it from the template first.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Dependency vulnerability audit
        run: composer audit

      - name: Container lint (dev and prod)
        run: |
          APP_SECRET=ci php bin/console lint:container
          APP_ENV=prod APP_SECRET=ci php bin/console lint:container

      - name: Static analysis (PHPStan)
        run: |
          APP_SECRET=ci php bin/console cache:warmup
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/phpstan analyse -c phpstan.tests.neon --no-progress --memory-limit=1G

      - name: Module boundaries (Deptrac)
        run: vendor/bin/deptrac analyse --no-progress

      - name: Tests (PHPUnit, incl. schema.sql parity)
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pal/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pal/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: pal/Dockerfile
          failure-threshold: error

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pal
          file: pal/Dockerfile
          load: true
          push: false
          tags: pal:ci

      - name: Smoke test (container starts, liveness answers, refuses missing config)
        run: |
          set -eu
          if docker run --rm pal:ci web 2>/dev/null; then echo "expected startup to fail without config" >&2; exit 1; fi
          docker run -d --name pal-smoke -p 8080:8080 \
            -e APP_SECRET=ci -e PAL_BASE_URL=http://localhost:8080 -e TRUSTED_HOSTS='^localhost$' \
            -e DATABASE_URL='postgresql://none:none@127.0.0.1:5432/none?serverVersion=17' pal:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health/live && break; sleep 1; done
          curl -fsS http://localhost:8080/health/live
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/sign-in | grep -q 200
          test "$(docker exec pal-smoke id -u)" = "10001"
          docker rm -f pal-smoke

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pal:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan for committed secrets (gitleaks)
        run: docker run --rm -v "$PWD/pal:/scan:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /scan --redact --no-banner --exit-code 1

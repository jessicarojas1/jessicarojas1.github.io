services:
  - type: web
    name: cmmc-compliance-agent
    runtime: python            # Python runtime; see docker alternative below
    rootDir: cmmc-agent
    buildCommand: pip install -r requirements.txt
    # Production WSGI server (gunicorn). Single worker → single writer for the
    # JSON state files. For local dev use `python server.py`.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --timeout 120 server:app
    plan: free
    healthCheckPath: /healthz         # lightweight liveness, no ANTHROPIC_API_KEY
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # set manually in the Render dashboard / secret store
      - key: PORT
        value: 10000           # Render routes traffic to this port
      - key: WEB_CONCURRENCY
        value: 1               # single gunicorn worker (single JSON-state writer)

# ─────────────────────────────────────────────────────────────────────────────
